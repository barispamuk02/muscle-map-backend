name: Wake billing risk alert worker
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-alert-worker-wakeup
  cancel-in-progress: false

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wake Render backend and verify health response
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          url = 'https://muscle-map-backend.onrender.com/health'
          for attempt in range(1, 5):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent':'MuscleMap-BillingAlertWake/1.0'})
                  with urllib.request.urlopen(request, timeout=85) as response:
                      payload = json.load(response)
                      if response.status == 200 and payload.get('ok') is True:
                          print('Backend health verified; in-process alert worker triggered on startup')
                          break
                      raise RuntimeError('invalid health response')
              except (urllib.error.URLError, TimeoutError, ValueError, RuntimeError) as error:
                  print(f'Wake attempt {attempt} unsuccessful: {type(error).__name__}')
                  if attempt == 4:
                      raise
                  time.sleep(8)
          PY
