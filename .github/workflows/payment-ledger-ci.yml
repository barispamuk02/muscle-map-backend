name: Backend Payment Ledger Regression
on:
  push:
    branches:
      - fix/issue-10-payment-ledger
      - main
      - feature/server-only-premium-program-progression-20261017
  pull_request:
    paths:
      - 'db.js'
      - 'production-auth-schema-migration.js'
      - 'production-claim-approval.js'
      - 'production-paid-claim.js'
      - 'production-owner-bootstrap.js'
      - 'production-owner-local-login.js'
      - 'production-operator-local-key.js'
      - 'scripts/enroll-production-operator-key.mjs'
      - 'scripts/run-production-key-enrollment.ps1'
      - 'scripts/production-one-owner-paid-claim.mjs'
      - 'scripts/run-production-one-paid-claim.ps1'
      - 'scripts/production-owner-operator.mjs'
      - 'scripts/run-production-owner-operator.ps1'
      - 'server.js'
      - 'premium-program-progression.js'
      - 'payment-events.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/payment-ledger-ci.yml'
permissions:
  contents: read
jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: muscle_map_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d muscle_map_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/muscle_map_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies with locked versions
        run: npm ci --no-audit --no-fund
      - name: Validate source syntax
        run: |
          node --check server.js
          node --check premium-program-progression.js
          node --check db.js
          node --check payment-events.js
          node --check auth-identity.js
          node --check legacy-account-claim.js
          node --check legacy-account-claim-rollback.js
          node --check staging-claim-approval.js
          node --check staging-claim-operator.js
          node --check production-auth-rollout-guard.js
          node --check production-auth-schema-migration.js
          node --check production-claim-approval.js
          node --check production-paid-claim.js
          node --check production-owner-bootstrap.js
          node --check production-owner-local-login.js
          node --check production-operator-local-key.js
          node --check scripts/enroll-production-operator-key.mjs
          node --check tests/production-operator-local-key.test.js
          node --check scripts/production-one-owner-paid-claim.mjs
          node --check scripts/production-owner-operator.mjs
          node --check tests/production-owner-bootstrap.test.js
          node --check tests/production-release-gates.test.js
          node --check tests/production-auth-schema.integration.mjs
          node --check tests/production-auth-rollout-guard.test.js
          node --check staging-operator-local-key.js
          node --check scripts/enroll-staging-operator-key.mjs
          node --check scripts/verify-staging-operator-key.mjs
          node --check scripts/staging-claim-approved-apply.mjs
          node --check tests/staging-operator-local-key.test.js
          node --check scripts/staging-claim-preview.mjs
          node --check tests/staging-claim-operator.test.js
          node --check tests/legacy-claim-rollback.integration.mjs
          node --check tests/premium-period-reconciliation.integration.mjs
          node --check dodo-ownership-audit.js
          node --check dodo-merchant-preview.js
          node --check scripts/dodo-live-audit.mjs
          node --check staging-billing-preflight.js
          node --check scripts/dodo-staging-send-otp.mjs
          node --check scripts/dodo-staging-confirm-otp.mjs
          node --check billing-email-otp.js
          node --check trusted-dodo-claim-review.js
          node --check resend-mailer.js
          node --check staging-mail-test.js
          node --check webhook-transaction.js
      - name: Parse local Windows PowerShell operator workflow without executing
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = (Resolve-Path ./scripts/run-staging-billing-otp.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host ("Parse issue at line " + $_.Extent.StartLineNumber + ": " + $_.Message) }; throw "PowerShell operator script has syntax errors" }
          $errors = $null
          $file = (Resolve-Path ./scripts/run-staging-claim-preview.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Read-only operator preview script has syntax errors" }
          $errors = $null
          $file = (Resolve-Path ./scripts/run-staging-operator-enrollment.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "Operator enrollment script has syntax errors" }
          $errors = $null
          $file = (Resolve-Path ./scripts/run-staging-premium-transfer.ps1).Path
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host ("Operator script line " + $_.Extent.StartLineNumber + ": " + $_.Message) }; throw "Staging Premium operator transfer script has syntax errors" }
      - name: The Production operator PowerShell helper must parse (no execution)
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './scripts/run-production-owner-operator.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Production operator PowerShell syntax invalid' }
      - name: Production signer PowerShell helper must parse (no execution)
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './scripts/run-production-key-enrollment.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'Production signer PowerShell syntax invalid' }
      - name: One-owner Production transfer PowerShell must parse (never execute)
        shell: pwsh
        run: |
          $tokens=$null; $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path './scripts/run-production-one-paid-claim.ps1').Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw 'One-owner transfer PowerShell syntax invalid' }
      - name: Unit regressions
        run: npm test
      - name: Run additive Production-schema rehearsal on disposable PostgreSQL only
        run: node tests/production-auth-schema.integration.mjs
      - name: Real PostgreSQL ledger integration
        run: node tests/payment-ledger.integration.mjs
      - name: PostgreSQL new Neon customer paid Premium, no legacy transfer (synthetic)
        run: node tests/new-neon-buyer-premium.integration.mjs
      - name: PostgreSQL verified-claim rollback and audit (synthetic records only)
        run: node tests/legacy-claim-rollback.integration.mjs
      - name: PostgreSQL one-step paid period reconciliation (synthetic only)
        run: node tests/premium-period-reconciliation.integration.mjs
      - name: PostgreSQL independent billing-email OTP and Dodo audit
        run: node tests/billing-email-otp.integration.mjs
      - name: PostgreSQL staging email delivery throttle (mock Resend)
        run: node tests/staging-mail.integration.mjs
